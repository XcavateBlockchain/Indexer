# Full indexer stack: postgres + the Carbon/Rust indexer + the Carbon/Rust GraphQL api,
# plus Prometheus/Grafana monitoring.
#
# Local dev:  cp .env.example .env  →  docker compose up -d --build
# Production: images are prebuilt by CI (GHCR); the deploy workflow writes an
# .env on the server that pins INDEXER_IMAGE / API_IMAGE / PG_IMAGE to immutable sha tags.
#
# Rollback: the previous SubQuery-based stack is preserved, unchanged, in
# docker-compose.subquery.yml -- see that file's header and MIGRATION_LOG.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: docker/pg-Dockerfile
    image: ${PG_IMAGE:-indexer-postgres:local}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      # Applied only on FIRST initialization of the pgdata volume; rotating it
      # later requires ALTER USER inside postgres first (see docs/deployment.md).
      # This is the SAME pgdata volume the old SubQuery stack used (its `app` schema
      # coexists alongside this stack's public-schema tables) -- see docker-compose.subquery.yml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: indexer
    image: ${INDEXER_IMAGE:-indexer:local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Composed here, not a separate DATABASE_URL secret (ruling R2).
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/postgres
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:?ALCHEMY_API_KEY must be set in .env}
      RUST_LOG: ${RUST_LOG:-info,hyper=warn,h2=warn,tonic=warn,rustls=warn}
      # ALCHEMY_GRPC_URL / ALCHEMY_RPC_URL / RPC_FALLBACK_URL / PROGRAMS / METRICS_ADDR /
      # RECONCILE_INTERVAL / METADATA_FETCH_INTERVAL all have working defaults baked into
      # the binary (crates/indexer/src/config.rs; the default PROGRAMS set is all four
      # programs) -- only set them here (or in .env, wired through above) if overriding
      # one for a specific deployment.
    healthcheck:
      # Runs `indexer run`: migrations, then the startup subscribe gate (up to 30s on a
      # slow link), then the metrics listener -- see crates/indexer/src/main.rs. curl is
      # installed in docker/rust.Dockerfile's runtime-base stage for exactly this.
      test: ["CMD", "curl", "-f", "http://localhost:9464/metrics"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: api
    image: ${API_IMAGE:-indexer-api:local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GRAPHQL_PORT:-3010}:3010"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/postgres
      GRAPHQL_PORT: "3010"
      # 9465, not the indexer's 9464 -- crates/api/src/config.rs's own default, so the two
      # binaries' /metrics listeners never collide when scraped from the same compose
      # network (verified against task-5-report.md; the brief's suggested value was
      # correct here, task-6-report.md independently confirmed it against source).
      METRICS_ADDR: "0.0.0.0:9465"
      # Lets /health's and syncStatus's getSlot calls use the paid Alchemy endpoint
      # instead of falling back to public devnet (crates/api/src/config.rs tolerates this
      # being unset -- it degrades to RPC_FALLBACK_URL -- but the primary endpoint is
      # faster and not rate-limited).
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:?ALCHEMY_API_KEY must be set in .env}
      # Comma-separated list of origins allowed to call /graphql from a browser; unset or
      # empty allows every origin (crates/api/src/config.rs).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    logging: *default-logging
    # Deliberately no depends_on: monitoring must stay up precisely when the
    # thing it monitors is down. Prometheus tolerates an unreachable target.
    #
    # Bound to loopback, not 0.0.0.0: Grafana reaches it over the compose
    # network, and Prometheus has no auth of its own, so it must not be exposed
    # publicly. For ad-hoc PromQL on the server, tunnel it over SSH
    # (see docs/deployment.md).
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Task 6's prometheus.yml has `rule_files: [/etc/prometheus/alerts.yml]`; must land
      # at exactly this path or Prometheus fails to start.
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Node metrics are only useful recent; cap the TSDB so it cannot grow
      # without bound on a small server.
      - --storage.tsdb.retention.time=15d
    healthcheck:
      # prom/prometheus's image is busybox-based (no curl); its wget supports --spider.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:13.1.3
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GRAFANA_PORT:-3011}:3000"
    environment:
      # Local default is admin/admin; the deploy workflow requires a real
      # password from the GRAFANA_PASSWORD secret before it will ship.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Datasource + dashboard provider definitions, applied on every start.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON, loaded by the file provider. Kept outside
      # /var/lib/grafana so it does not nest inside the grafanadata volume.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  # SAME name as the old stack (docker-compose.subquery.yml) -- it is the same postgres
  # instance/volume; the SubQuery schema `app` coexists in it, which is the rollback path.
  pgdata:
  promdata:
  grafanadata:
