[package]
name = "indexer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
carbon-xcavate-whitelist-decoder = { path = "../whitelist-decoder", features = ["postgres"] }
carbon-marketplace-decoder = { path = "../marketplace-decoder", features = ["postgres"] }
carbon-property-decoder = { path = "../property-decoder", features = ["postgres"] }
carbon-regions-decoder = { path = "../regions-decoder", features = ["postgres"] }
carbon-realxhub-decoder = { path = "../realxhub-decoder", features = ["postgres"] }
# Pinned to 0.8.6 to match the version the generated decoder crate already pulls in via its
# own `postgres` feature (see .superpowers/sdd/carbon-migration-spec/env-notes.md, ruling R9)
# -- a mismatched sqlx version here would duplicate the dependency graph.
sqlx = { version = "=0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "chrono",
    "json",
] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# --- Carbon stack -------------------------------------------------------------------------
# ALL carbon-* crates are pinned to exactly 0.12.0 (ruling R9). The generated decoder depends
# on `carbon-core = "0.12.0"`; carbon-core 1.0.0 is semver-incompatible with it, and mixing
# would put two carbon_core copies in the graph so the decoder's InstructionDecoder impl would
# not satisfy a PipelineBuilder built against the other one.
carbon-core = "=0.12.0"
carbon-yellowstone-grpc-datasource = "=0.12.0"
carbon-rpc-transaction-crawler-datasource = "=0.12.0"

# --- Solana --------------------------------------------------------------------------------
# 3.0.0 to match carbon-core's `^3.0.0` bounds (env-notes.md pins).
solana-pubkey = { version = "3.0.0", features = ["serde", "borsh", "curve25519"] }
solana-account = "3.0.0"
solana-instruction = { version = "3.0.0", default-features = false }
solana-signature = "3.0.0"
solana-commitment-config = "3.0.0"
# The canonical native-program ids (the upgrade recorder needs BPFLoaderUpgradeable's, see
# src/upgrades.rs). Already in the graph transitively via the solana stack.
solana-sdk-ids = "3.0.0"
# Used for the block_time fallback lookup (`getBlockTime`) and by the verification helpers.
# Already in the graph via carbon-rpc-transaction-crawler-datasource.
solana-client = "3.0.0"

# --- Yellowstone gRPC ----------------------------------------------------------------------
# Same versions carbon-yellowstone-grpc-datasource resolves to, so the CommitmentLevel /
# SubscribeRequestFilter* types we hand it are the same types. `smoke-grpc` also drives the
# raw client directly -- see src/grpc_smoke.rs for why.
yellowstone-grpc-client = "10.0.0"
yellowstone-grpc-proto = { version = "10.0.0", features = ["convert"] }

# --- Runtime / plumbing --------------------------------------------------------------------
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
# Off-chain property metadata fetch (ADR-27). default-features OFF: the default
# `default-tls` pulls native-tls (OpenSSL) into the Linux container build; rustls matches
# sqlx's `runtime-tokio-rustls` and is already in the graph. `stream` gives the bounded
# response-body read (the 2 MiB cap in `metadata::fetch_document`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# `http-listener` gives the /metrics HTTP endpoint; `push-gateway` (a default feature) is
# turned off because it drags in aws-lc-rs, which needs cmake+nasm to build on Windows.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
    "http-listener",
] }
# --- Property image mirror (ADR-31) ----------------------------------------------------------
# default-features OFF: the default set pulls avif/tiff/gd/icc extras (and, on Windows,
# windows-* crates) that we never use. We only decode what the marketplace ships — jpeg,
# png, webp — and always re-encode to JPEG, so those three decoders plus the jpeg encoder
# are the whole surface we need.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# S3-compatible PUT for Hetzner Object Storage. Async client: the `with-tokio` backend is
# plain `reqwest` (same 0.12 line as our own fetch client), so `images.rs` just `.await`s
# the PUT. `default-features` OFF because the default set is `tokio-native-tls`, which pulls
# native-tls/OpenSSL into the container build; `tokio-rustls-tls` matches sqlx's
# `runtime-tokio-rustls` and is already in the graph. `fail-on-err` (a default feature, hence
# listed explicitly) makes non-2xx PUTs (bad key, bucket denied) surface as `Err` instead of
# being returned as a `ResponseData` we would have logged as success.
rust-s3 = { version = "0.37", default-features = false, features = [
    "fail-on-err",
    "tokio-rustls-tls",
] }
# Already in the lockfile transitively (sqlx). We compute SHA-256 of the source URI so
# `object_key` is deterministic per (pubkey, index, uri).
sha2 = "0.10"
# ADR-32: rustls 0.23 panics at the FIRST TLS use when the unified crate-feature set enables
# more than one `CryptoProvider` — `ring` (sqlx's `runtime-tokio-rustls` ring path, the solana
# stack) and `aws_lc_rs` (attohttpc's `rustls/default`, pulled in by rust-s3 -> aws-creds) are
# both on in this graph. The binary ends the ambiguity itself: it installs the `ring` provider
# explicitly at the top of `main()` (src/main.rs). This direct edge is what makes
# `rustls::crypto::ring` resolvable in this crate.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
solana-message = "3.0.0"
solana-transaction-status = "3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
