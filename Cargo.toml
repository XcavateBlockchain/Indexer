[workspace]
resolver = "2"
members = ["crates/*"]
# The decoder crates are generated by `@sevenlabs-hq/carbon-cli` (0.12.0), which always emits
# its own empty `[workspace]` table in the generated Cargo.toml (there is no longer a
# `--standalone false` flag to suppress this). A crate carrying its own `[workspace]` table
# cannot also be a member of an enclosing workspace ("multiple workspace roots found"), so they
# are excluded here and consumed by crates/indexer as ordinary path dependencies instead.
# See .superpowers/sdd/carbon-migration-spec/task-1-report.md.
exclude = [
    "crates/whitelist-decoder",
    "crates/marketplace-decoder",
    "crates/property-decoder",
    "crates/regions-decoder",
]
