[workspace]
resolver = "2"
members = ["crates/*"]
# The decoder crate is generated by `@sevenlabs-hq/carbon-cli` (0.12.0), which always emits
# its own empty `[workspace]` table in the generated Cargo.toml (there is no longer a
# `--standalone false` flag to suppress this). A crate carrying its own `[workspace]` table
# cannot also be a member of an enclosing workspace ("multiple workspace roots found"), so it
# is excluded here and consumed by crates/indexer and crates/api as an ordinary path
# dependency instead. See .superpowers/sdd/carbon-migration-spec/task-1-report.md.
exclude = ["crates/whitelist-decoder"]
