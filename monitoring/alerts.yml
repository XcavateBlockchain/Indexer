# Prometheus alerting rules for the indexer stack.
#
# Ruling R19: rules only, no Alertmanager. Notification routing (paging, Slack, email,
# ...) is explicitly out of scope for this migration; these rules exist so firing alerts
# are visible in Prometheus's own /alerts page and, via the Prometheus datasource, in
# Grafana's alerting/annotations views. Nothing here sends a notification anywhere.
#
# Mounted read-only at /etc/prometheus/alerts.yml (see docker-compose.yml and
# monitoring/prometheus.yml's `rule_files`).
#
# Metric names verified against crates/indexer/src/metrics.rs, crates/api/src/metrics.rs
# and carbon-core 0.12.0's own pipeline.rs (see task-6-report.md for the verification
# trail). One correction vs. the task brief: there is no `backfill_complete` Prometheus
# gauge (it exists only as a `sync_state` DB column and a GraphQL/`/health` field, never
# exported as a metric) -- see BackfillStalled below for how that rule is derived instead.

groups:
  - name: indexer.rules
    rules:
      - alert: SlotLagHigh
        # last_contiguous_slot is per-program (one series per indexed program); the
        # unlabeled chain_tip_slot is matched onto every program series with
        # ignoring(program) group_right, so this fires (and names) each lagging program
        # individually.
        expr: chain_tip_slot - ignoring(program) group_right last_contiguous_slot > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer slot lag is above 3000 slots (~20 min of devnet blocks) for {{ $labels.program }}"
          description: >-
            chain_tip_slot - last_contiguous_slot has stayed above 3000 for 5 minutes
            for program {{ $labels.program }}. This is the ground-truth freshness
            measure -- a proven-contiguous lag, not a "last row written" lag. Sustained
            high lag means the live stream, that program's startup backfill, or the
            reconciliation supervisor is not keeping up.

      - alert: DecodeFailures
        expr: increase(updates_failed[10m]) > 0 or increase(decode_skipped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Instruction decode/mapping failures in the last 10 minutes"
          description: >-
            updates_failed (carbon-core: the processor returned Err) or
            decode_skipped_total (an instruction decoded but could not be mapped to its
            program's rows; see the program and reason labels) increased in the last 10
            minutes. Per Task 3, a mapping failure is only reachable if a deployed
            program's account order diverges from its checked-in IDL -- treat this as a
            data-integrity signal, not noise.

      - alert: IndexerDown
        expr: up{job="indexer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The indexer's /metrics endpoint has been unreachable for 2 minutes"
          description: >-
            Prometheus cannot scrape indexer:9464. Covers "the process is down" and,
            to the extent it is observable at all, "the process is up but its gRPC
            stream is disconnected" -- carbon's Yellowstone datasource re-subscribes
            internally on a stream error without the process (or this scrape target)
            ever going down, so a short stream drop that healed itself will NOT trip
            this rule. SlotLagHigh is the metric that catches that case; see the Stream
            health panel's description for the same caveat.

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The GraphQL API's /metrics endpoint has been unreachable for 2 minutes"
          description: "Prometheus cannot scrape api:9465."

      - alert: ReconnectStorm
        expr: increase(grpc_reconnects_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "More than 5 gRPC stream reconnects in 15 minutes"
          description: >-
            grpc_reconnects_total counts Yellowstone gRPC stream sessions that ended
            and had to be rebuilt by the reconnect loop in main.rs. A storm usually
            means Alchemy throttling, a network problem, or an unhealthy upstream --
            note this undercounts brief blips the datasource heals internally (see
            IndexerDown's description), so treat this as a lower bound.

      # ProgramUpgradeDetected -- the agentic-maintenance trigger (ADR-24).
      #
      # program_upgrades_detected_total counts FIRST observations only: the batcher bumps
      # it exclusively for `program_upgrades` rows its ON CONFLICT insert actually created,
      # strictly after their commit (crates/indexer/src/batcher.rs), so backfill re-walks
      # re-delivering a historical upgrade transaction can never re-fire this. The series
      # is pre-registered at zero per program (metrics.rs install()), so `increase()` reads
      # a real 0 -> 1 step rather than "no data".
      #
      # The 1h window is a visibility choice, not a detection one (detection is
      # at-most-once per boundary -- an ambiguous commit retried as a no-op can skip the
      # counter, which is one more reason the durable record below matters):
      # with no Alertmanager (ruling R19), a firing alert is only as useful as the chance
      # someone sees it on the /alerts page or the Grafana annotation, so it stays lit for
      # a full hour after the step. The durable record is the `program_upgrades` table and
      # the `programUpgrades` GraphQL query -- if this alert has come and gone, the row has
      # not.
      - alert: ProgramUpgradeDetected
        expr: increase(program_upgrades_detected_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.program }} was upgraded on-chain -- its decoder may now be stale"
          description: >-
            The indexer observed a BPFLoaderUpgradeable Upgrade of {{ $labels.program }}
            and recorded a new version boundary in program_upgrades. The running decoder
            was generated from the checked-in pre-upgrade IDL: until the maintenance
            pipeline ships a decoder for the new version, instructions the upgrade added
            or changed will surface as DecodeFailures (or, worse, not at all). Follow
            RUNBOOK.md "After a program upgrade"; the boundary slot is in the
            programUpgrades GraphQL query.

      # BackfillStalled -- derived, not the brief's literal expression.
      #
      # The brief's suggested rule (`backfill_complete == 0 and
      # increase(backfill_last_processed_slot[15m]) == 0`) assumes a `backfill_complete`
      # Prometheus gauge. Checked against task-4-report.md's metrics table
      # (crates/indexer/src/metrics.rs): no such gauge exists. `backfill_complete` is a
      # `sync_state` boolean column, surfaced only via GraphQL's `syncStatus` and
      # `/health` -- never exported as a metric. The only backfill-progress signal
      # Prometheus has is `backfill_last_processed_slot`, a gauge set ONLY by the
      # history-walk (not by reconciliation) that falls monotonically while a walk is
      # in progress and then freezes forever once the walk completes (task-4-report.md,
      # "Metrics" table).
      #
      # `changes()` (not `increase()`, which is for counters) is the right function for
      # a gauge: it counts value changes in the window regardless of direction. The
      # slot-lag condition is ANDed in for two reasons: (1) it is what keeps this rule
      # from being permanently latent-true after a completed backfill, since the gauge
      # freezing is then expected, not stalled; (2) it is the only proxy this rule has
      # for "a backfill (or a reconciliation catch-up crawl) SHOULD be making progress
      # right now". Caveat, noted here rather than hidden: because
      # backfill_last_processed_slot never resumes after completion, if the reconciler
      # itself stalls post-backfill for long enough to also breach the 3000-slot lag
      # threshold, this rule fires alongside SlotLagHigh even though the *initial*
      # backfill is long done. That is an acceptable false-labelling (not a
      # false-positive -- something genuinely is stuck) given no better signal exists
      # without adding a new metric, which is out of this task's scope (monitoring/**
      # only, no Rust).
      - alert: BackfillStalled
        # Both gauges are per-program now; the lag side is matched per program like
        # SlotLagHigh, and the `and` then matches the two sides on their shared
        # (program, instance, job) labels, so each program's stall is judged against
        # its own walk.
        expr: (chain_tip_slot - ignoring(program) group_right last_contiguous_slot > 3000) and changes(backfill_last_processed_slot[15m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No backfill progress in 15 minutes while {{ $labels.program }} is behind"
          description: >-
            backfill_last_processed_slot for {{ $labels.program }} has not changed in 15
            minutes while its chain_tip_slot - last_contiguous_slot exceeds 3000. Most likely a stuck
            history walk (a poison signature, or every configured RPC endpoint
            failing -- see task-4-report.md concern #2/#3). Also fires if the
            reconciliation supervisor stalls well after a completed backfill, since
            backfill_last_processed_slot does not resume in that phase; check
            `syncStatus`/`/health`'s `backfillComplete` field to tell the two cases
            apart.

      # WebhookDeliveryFailing -- counter-based, because the gauge is spiky.
      #
      # The naive expression `webhooks_pending > 0 for 30m` does NOT work with the
      # ADR-28 backoff design: the work set (and thus the gauge) excludes a row while
      # its backoff runs, and at the 1 h cap a failing event sits in the work set only
      # for the <=5 s cycle that retries it, then out again for up to an hour -- the
      # series is near-zero except for brief spikes a scrape may miss. The failure
      # COUNTER is the stable signal: every failed POST bumps
      # webhooks_delivered_total{result="failure"} (pre-registered at zero in
      # metrics.rs's install(), like DecodeFailures' series), and the 1 h backoff cap
      # guarantees at least one failed attempt -- hence one bump -- inside any 2 h
      # window while an endpoint stays down. A single transient failure also fires
      # this (the house stance, cf. DecodeFailures): the alert stays lit until the
      # failure ages out of the window, and the durable `webhook_events` rows
      # (last_error / attempts / next_attempt_at) say what actually happened.
      - alert: WebhookDeliveryFailing
        expr: increase(webhooks_delivered_total{result="failure"}[2h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbound property-asset webhook deliveries have been failing"
          description: >-
            webhooks_delivered_total{result="failure"} increased in the last 2
            hours: the indexer's webhook delivery loop (ADR-28) has been POSTing
            property-asset-registration payloads to WEBHOOK_URL and the endpoint
            is failing (non-2xx, connect error, or timeout). Events are NOT lost --
            they are durable rows in webhook_events that retry with exponential
            backoff (30 s doubling, 1 h cap) until the endpoint answers 2xx. Check
            the endpoint and the per-row last_error; see RUNBOOK.md "Property-asset
            registration webhooks".

      # PropertyImageMirrorFailing -- counter-based, for the same reason as
      # WebhookDeliveryFailing.
      #
      # `property_images_pending > 0 for 30m` does NOT work with the ADR-31 per-image
      # backoff: a failing image is excluded from the work set (and the gauge) while its
      # backoff runs, and at the 1 h cap it is in the set only for the <=cycle retry, then
      # out for up to an hour again -- the series spikes to zero and back a scrape can miss.
      # The failure COUNTER is the stable signal: every failed mirror attempt bumps
      # property_images_mirrored_total{result="failure"} (pre-registered at zero in
      # metrics.rs's install(), like webhooks_delivered_total), and the 1 h backoff cap
      # guarantees at least one failed attempt -- hence one bump -- inside any 2 h window
      # while a source stays down. The alert also fires on a single transient failure
      # (house stance, cf. DecodeFailures) and stays lit until the failure ages out of the
      # window; the durable per-image state (last_error / attempts / next_attempt_at) is in
      # `marketplace_property_image`. Note the rule is latent while the mirror is disabled
      # (OBJECT_STORAGE_* unset): no cycle runs, so no failure series ever exists -- and
      # there is nothing to fail.
      - alert: PropertyImageMirrorFailing
        expr: increase(property_images_mirrored_total{result="failure"}[2h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Property-image mirroring to object storage has been failing"
          description: >-
            property_images_mirrored_total{result="failure"} increased in the last 2
            hours: the indexer's property-image mirror loop (ADR-31) has been
            downloading propertyImages source URIs and/or uploading the compressed
            720x720 JPEGs to OBJECT_STORAGE_BUCKET and failing (source fetch error,
            non-image body, or S3 PUT error). Images are NOT lost -- each source URI is
            a durable row in marketplace_property_image that retries with exponential
            backoff (30 s doubling, 1 h cap) until the upload succeeds. Check the
            per-row last_error and the OBJECT_STORAGE_* credentials; see RUNBOOK.md
            "Property-image mirror".
