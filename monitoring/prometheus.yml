# Prometheus scrape config for the indexer stack.
#
# `indexer` (crates/indexer, the Carbon pipeline) and `api` (crates/api, the GraphQL
# server) each serve Prometheus metrics on their own `/metrics` listener
# (METRICS_ADDR), on the ports below. Neither port is published to the host;
# Prometheus reaches them over the compose network by service name.
#
# The old `subquery-node` scrape job (SubQuery node-core's combined admin/metrics
# port 3000) belonged to the SubQuery stack this migration replaces; it is gone
# from this file but still exists in git history for the rollback stack.
#
# Mounted read-only at /etc/prometheus/prometheus.yml (see docker-compose.yml).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "indexer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["indexer:9464"]

  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:9465"]
