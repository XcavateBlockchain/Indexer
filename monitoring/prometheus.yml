# Prometheus scrape config for the indexer stack.
#
# The SubQuery node (@subql/node-core) serves Prometheus metrics at /metrics on
# the same port as its admin/health API (3000). That port is deliberately not
# published to the host, so Prometheus reaches it over the compose network by
# service name.
#
# Mounted read-only at /etc/prometheus/prometheus.yml (see docker-compose.yml).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "subquery-node"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["subquery-node:3000"]
