name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/indexer

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      repo_lc: ${{ steps.vars.outputs.repo_lc }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image repo
        id: vars
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SubQuery rollback path — disabled, see DECISIONS.md. Kept, not deleted, so the
      # migration can be backed out; re-enable by uncommenting alongside
      # docker-compose.subquery.yml.
      #
      # - name: Build & push indexer node image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: docker/node.Dockerfile
      #     push: true
      #     tags: |
      #       ghcr.io/${{ steps.vars.outputs.repo_lc }}/node:latest
      #       ghcr.io/${{ steps.vars.outputs.repo_lc }}/node:${{ github.sha }}
      #     cache-from: type=gha,scope=node
      #     cache-to: type=gha,scope=node,mode=max
      #
      # - name: Build & push gRPC API image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: grpc-api
      #     push: true
      #     tags: |
      #       ghcr.io/${{ steps.vars.outputs.repo_lc }}/grpc:latest
      #       ghcr.io/${{ steps.vars.outputs.repo_lc }}/grpc:${{ github.sha }}
      #     cache-from: type=gha,scope=grpc
      #     cache-to: type=gha,scope=grpc,mode=max

      - name: Build & push indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rust.Dockerfile
          target: indexer
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/indexer:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/indexer:${{ github.sha }}
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,scope=indexer,mode=max

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rust.Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/api:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pg-Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/postgres:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/postgres:${{ github.sha }}
          cache-from: type=gha,scope=pg
          cache-to: type=gha,scope=pg,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HOST: ${{ secrets.HETZNER_HOST }}
          PORT: ${{ secrets.HETZNER_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            Port $PORT
            User ${{ secrets.HETZNER_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Render server .env
        env:
          REPO_LC: ${{ needs.build-and-push.outputs.repo_lc }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAPHQL_PORT: ${{ vars.GRAPHQL_PORT || '3010' }}
          GRAFANA_PORT: ${{ vars.GRAFANA_PORT || '3011' }}
          PROMETHEUS_PORT: ${{ vars.PROMETHEUS_PORT || '9090' }}
          # ADR-31 image mirror + ADR-28 webhooks: OPTIONAL. Unset = the line is
          # omitted from server.env, compose passes an empty string, and
          # crates/indexer/src/config.rs treats that as unset (the mirror/webhook
          # loop simply never spawns). The five OBJECT_STORAGE_* secrets are
          # all-or-nothing, mirroring config.rs exactly: a partial set fails HERE,
          # at render time, instead of crash-looping the indexer on the server.
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
          OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
          OBJECT_STORAGE_PUBLIC_BASE_URL: ${{ vars.OBJECT_STORAGE_PUBLIC_BASE_URL }}
          IMAGE_MIRROR_INTERVAL: ${{ vars.IMAGE_MIRROR_INTERVAL }}
          INIT_PROPERTY_ASSET_WEBHOOK_URL: ${{ secrets.INIT_PROPERTY_ASSET_WEBHOOK_URL }}
          # Also optional, not sensitive: logging verbosity and the API's browser CORS
          # allow-list (compose supplies its own defaults when the lines are absent).
          RUST_LOG: ${{ vars.RUST_LOG }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          # Secrets are written single-quoted: docker compose's dotenv parser
          # takes single-quoted values literally, so `$`, spaces and `#` in a
          # secret survive. Values compose cannot represent are rejected.
          #
          # An unset secret is rejected too: compose would otherwise silently
          # fall back to a default (Grafana's is admin/admin, on a published
          # port) or fail later on the server with an opaque message.
          dotenv_secret() {
            if [ -z "$2" ]; then
              echo "::error::secret $1 is not set — add it under Settings → Secrets and variables → Actions" >&2
              exit 1
            fi
            case "$2" in
              *\'* | *$'\n'* )
                echo "::error::secret $1 must not contain single quotes or newlines" >&2
                exit 1;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }
          # Optional values: unset/empty = the line is omitted entirely (the
          # feature stays disabled); set = the same quoting rules as a secret.
          dotenv_optional() {
            if [ -z "$2" ]; then
              return 0
            fi
            case "$2" in
              *\'* | *$'\n'* )
                echo "::error::$1 must not contain single quotes or newlines" >&2
                exit 1;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }
          # A typo in a port variable should fail here, with a readable message,
          # rather than as an opaque compose error midway through the deploy.
          dotenv_port() {
            case "$2" in
              '' | *[!0-9]* )
                echo "::error::$1 must be a port number, got '$2'" >&2
                exit 1;;
            esac
            if [ "$2" -lt 1 ] || [ "$2" -gt 65535 ]; then
              echo "::error::$1 must be within 1-65535, got '$2'" >&2
              exit 1
            fi
            printf '%s=%s\n' "$1" "$2"
          }
          # The image mirror's five secrets are all-or-nothing (same contract as
          # ObjectStorageConfig::from_env in crates/indexer/src/config.rs): count
          # how many are set and fail the render on a partial set.
          object_storage_set=0
          for v in "$OBJECT_STORAGE_ENDPOINT" "$OBJECT_STORAGE_BUCKET" "$OBJECT_STORAGE_REGION" \
                   "$OBJECT_STORAGE_ACCESS_KEY" "$OBJECT_STORAGE_SECRET_KEY"; do
            [ -n "$v" ] && object_storage_set=$((object_storage_set + 1))
          done
          if [ "$object_storage_set" -gt 0 ] && [ "$object_storage_set" -lt 5 ]; then
            echo "::error::OBJECT_STORAGE_* is all-or-nothing: $object_storage_set of 5 set — set all five secrets or none" >&2
            exit 1
          fi
          # COMPLETENESS CONTRACT: this block must render EVERY line compose can read
          # from .env (see the `${...}` references in docker-compose.yml). The server
          # file is replaced wholesale on every deploy, so a value that is not rendered
          # here cannot be set at all -- hand edits do not survive. Keep this list in
          # sync when compose gains a new `${VAR}`.
          {
            dotenv_secret ALCHEMY_API_KEY "$ALCHEMY_API_KEY"
            dotenv_secret POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            dotenv_secret GRAFANA_PASSWORD "$GRAFANA_PASSWORD"
            echo "PG_IMAGE=ghcr.io/$REPO_LC/postgres:${{ github.sha }}"
            echo "INDEXER_IMAGE=ghcr.io/$REPO_LC/indexer:${{ github.sha }}"
            echo "API_IMAGE=ghcr.io/$REPO_LC/api:${{ github.sha }}"
            dotenv_port GRAPHQL_PORT "$GRAPHQL_PORT"
            dotenv_port GRAFANA_PORT "$GRAFANA_PORT"
            dotenv_port PROMETHEUS_PORT "$PROMETHEUS_PORT"
            if [ "$object_storage_set" -eq 5 ]; then
              dotenv_secret OBJECT_STORAGE_ENDPOINT "$OBJECT_STORAGE_ENDPOINT"
              dotenv_secret OBJECT_STORAGE_BUCKET "$OBJECT_STORAGE_BUCKET"
              dotenv_secret OBJECT_STORAGE_REGION "$OBJECT_STORAGE_REGION"
              dotenv_secret OBJECT_STORAGE_ACCESS_KEY "$OBJECT_STORAGE_ACCESS_KEY"
              dotenv_secret OBJECT_STORAGE_SECRET_KEY "$OBJECT_STORAGE_SECRET_KEY"
              dotenv_optional OBJECT_STORAGE_PUBLIC_BASE_URL "$OBJECT_STORAGE_PUBLIC_BASE_URL"
              dotenv_optional IMAGE_MIRROR_INTERVAL "$IMAGE_MIRROR_INTERVAL"
            fi
            dotenv_optional INIT_PROPERTY_ASSET_WEBHOOK_URL "$INIT_PROPERTY_ASSET_WEBHOOK_URL"
            dotenv_optional RUST_LOG "$RUST_LOG"
            dotenv_optional CORS_ALLOWED_ORIGINS "$CORS_ALLOWED_ORIGINS"
          } > server.env

      - name: Upload compose file, monitoring config and .env
        run: |
          ssh deploy-target "mkdir -p $DEPLOY_DIR"
          scp docker-compose.yml deploy-target:$DEPLOY_DIR/docker-compose.yml
          # prometheus.yml and the Grafana provisioning files are bind-mounted
          # by compose, so unlike the application code they are not baked into
          # an image and must exist on the server. Replaced wholesale, so a file
          # deleted from the repo also disappears from the server.
          ssh deploy-target "rm -rf $DEPLOY_DIR/monitoring"
          scp -r monitoring deploy-target:$DEPLOY_DIR/monitoring
          scp server.env deploy-target:$DEPLOY_DIR/.env
          ssh deploy-target "chmod 600 $DEPLOY_DIR/.env"

      - name: Pull images and restart stack
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            ssh deploy-target "echo '$GHCR_PULL_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          fi
          ssh deploy-target "cd $DEPLOY_DIR && docker compose pull && docker compose up -d --remove-orphans"
          # Prometheus only reads its config/rule files at startup or on an explicit reload,
          # and `up -d` leaves the running container untouched when only the mounted files
          # changed (its service definition and pinned image are unchanged) -- so an updated
          # monitoring/ tree would otherwise sit unread, silently running the OLD alert
          # rules. Worse, prometheus.yml/alerts.yml are single-FILE bind mounts, and the
          # rm -rf+scp above replaced them with new inodes while the running container's
          # mounts stay pinned to the deleted old ones -- so even a SIGHUP reload would
          # re-read stale content. Recreating the container re-resolves the bind-mount paths
          # and is the only reliable pickup; the TSDB lives in the promdata volume and
          # survives, and grafana's provisioning is a directory mount that its own restart
          # (via depends_on ordering on recreate) re-reads.
          ssh deploy-target "cd $DEPLOY_DIR && docker compose up -d --force-recreate prometheus grafana"

      - name: Verify deployment
        run: |
          sleep 30
          ssh deploy-target "cd $DEPLOY_DIR && docker compose ps"
          # The api service exposes /health once it can reach the DB (and, via ALCHEMY_API_KEY,
          # the chain tip for syncStatus). Both `indexer` and `api` images carry curl
          # (docker/rust.Dockerfile's runtime-base stage) -- api is used for every in-network
          # check below since it is already the container being probed for its own health.
          ssh deploy-target "cd $DEPLOY_DIR && docker compose exec -T api curl -sf http://localhost:3010/health" \
            && echo "api is ready"
          # Monitoring is probed from inside the compose network: Prometheus is
          # loopback-bound on the host and Grafana's port may be firewalled.
          ssh deploy-target "cd $DEPLOY_DIR && docker compose exec -T api curl -sf http://prometheus:9090/-/ready >/dev/null" \
            && echo "prometheus is ready"
          ssh deploy-target "cd $DEPLOY_DIR && docker compose exec -T api curl -sf --retry 5 --retry-delay 3 --retry-connrefused http://grafana:3000/api/health >/dev/null" \
            && echo "grafana is up"
          # Remove images unused for 7+ days (keeps recent SHA tags around for
          # the .env-pin rollback path documented in docs/deployment.md).
          ssh deploy-target "docker image prune -af --filter 'until=168h' >/dev/null"
