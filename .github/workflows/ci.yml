name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  indexer:
    name: SubQuery project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx subql codegen
      - run: npx subql build
      - run: npx tsc --noEmit

  grpc-api:
    name: gRPC API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grpc-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grpc-api/package-lock.json
      - run: npm ci
      - run: npm run build
